name: test
on: [push, workflow_dispatch]
jobs:
  software:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi
          python -m pip install -r test/requirements.txt
      - name: Verify encoder, model and test checkers
        run: python scripts/run_verification.py software --output artifacts/software
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: software-results
          path: artifacts/software/

  simulation:
    needs: software
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        profile: [rtl, rom, dead-rom]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
          python -m pip install -r test/requirements.txt
      - name: Verify simulation profile
        run: python scripts/run_verification.py ${{ matrix.profile }} --output artifacts/${{ matrix.profile }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.profile }}
          path: artifacts/${{ matrix.profile }}/
